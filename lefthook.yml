# Git hooks (lefthook). Fast local checkpoints; CI owns the full gate matrix.
# Install: runs automatically from `pnpm install` (postinstall ->
# scripts/install-lefthook.mjs); re-run that script if hooks go missing.

pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,tsx}'
      run: pnpm exec tsx scripts/run-oxlint.ts --fix {staged_files}
      stage_fixed: true
    - name: whitespace (staged)
      run: git diff --cached --check
    - name: agent notes (staged)
      glob: '.agents/notes/**'
      run: pnpm run verify-agent-note-classification && pnpm run verify-agent-note-format
    - name: archived agent notes (staged)
      glob: '.agents/notes/archived/**'
      run: pnpm run verify-archived-agent-notes
    - name: skill metadata (staged)
      glob: '.agents/skills/**'
      run: pnpm run verify-skill-invocation-metadata

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck
    - name: affected tests
      run: pnpm run test:affected
